[package]
name = "touchcraft"
version = "0.1.0"
edition = "2024"
description = "A local visual programming workspace for real-time images."

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15.4"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63", features = ["menu"] }
